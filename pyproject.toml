[build-system]
# SPDX license 表达式（PEP 639）需要 setuptools>=77，故下限随之抬高。
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "openthree"
version = "0.1.6"
description = "极简 LLM Agent Harness：agent 天然自我演化（命名、长工具、改提示词）"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yang Yifei" },
]
keywords = [
    "llm", "agent", "agent-harness", "openai", "react", "tool-calling",
    "self-evolving", "ai", "chatgpt",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "openai>=1.0",
    "PyYAML>=6.0",
    # 模型返回非法 JSON 参数时用于修复；生产环境也需要，故列入主依赖
    "json_repair>=0.30",
]

[project.urls]
Homepage = "https://github.com/YY-Yifei/openthree"
Source = "https://github.com/YY-Yifei/openthree"
Issues = "https://github.com/YY-Yifei/openthree/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
openthree = "openthree.cli:main"

[tool.setuptools.packages.find]
include = ["openthree*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
