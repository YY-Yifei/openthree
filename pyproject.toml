[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openthree"
version = "0.1.0"
description = "三生万物 —— 极简 LLM Agent Harness，agent 天然自我演化"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.0",
    "PyYAML>=6.0",
    # 模型返回非法 JSON 参数时用于修复；生产环境也需要，故列入主依赖
    "json_repair>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
openthree = "openthree.cli:main"

[tool.setuptools.packages.find]
include = ["openthree*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
