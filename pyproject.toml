[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openthree"
version = "0.1.0"
description = "三生万物 —— 极简 LLM Agent Harness，agent 天然自我演化"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openai>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "json_repair>=0.30"]

[project.scripts]
openthree = "openthree.cli:main"

[tool.setuptools.packages.find]
include = ["openthree*"]
